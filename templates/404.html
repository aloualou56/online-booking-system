{% load static %}
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Η σελίδα δεν βρέθηκε | Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(ellipse at 50% 0%, #1e1600 0%, #070600 55%, #000 100%) !important;
            min-height: 100vh !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 0 !important;
            font-family: 'Inter', sans-serif !important;
        }
        .error-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(201,162,39,0.2);
            max-width: 500px;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 900;
            color: #c9a227;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-icon {
            font-size: 4rem;
            color: #c9a227;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body style="background: radial-gradient(ellipse at 50% 0%, #1e1600 0%, #070600 55%, #000 100%) !important; margin:0 !important; font-family:'Inter',sans-serif !important;">
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-map-signs"></i>
        </div>
        <div class="error-code">404</div>
        <h2 class="text-white mb-3">Η σελίδα δεν βρέθηκε</h2>
        <p class="text-white-50 mb-4">Η σελίδα που ψάχνετε δεν υπάρχει ή έχει μετακινηθεί.</p>
        <a href="/" class="btn btn-lg px-4" style="background: linear-gradient(135deg, #c9a227, #f0c04a); color: #1a1a2e; font-weight: 600;">
            <i class="fas fa-home me-2"></i>Επιστροφή στην Αρχική
        </a>
    </div>
</body>
</html>
