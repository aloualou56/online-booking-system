{% load static %}
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Στάλθηκε — Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#c9a227; --gold-light:#f0c04a; }
        html,body { height:100%; margin:0; font-family:'Inter',sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #1e1600 0%, #070600 55%, #000 100%);
            scrollbar-width:none; -ms-overflow-style:none; }
        body::-webkit-scrollbar { display:none; }

        .auth-page { min-height:100vh; display:flex; flex-direction:column;
            align-items:center; justify-content:center; padding:40px 16px; }

        .auth-brand { text-align:center; margin-bottom:28px; }
        .auth-brand img { width:76px; height:76px; object-fit:contain;
            clip-path:inset(18% round 36px); display:block; margin:0 auto 10px; }
        .auth-brand .brand-name { font-size:1.75rem; font-weight:900;
            color:var(--gold-light); letter-spacing:-0.5px; }

        .auth-card { width:100%; max-width:480px;
            background:rgba(255,255,255,.04); border:1px solid rgba(201,162,39,.22);
            border-radius:20px; padding:38px 34px;
            backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
            box-shadow:0 24px 60px rgba(0,0,0,.55); text-align:center; }

        .success-icon { width:80px; height:80px; margin:0 auto 20px;
            background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            animation:scaleIn .4s ease-out; }
        .success-icon i { font-size:2.5rem; color:#0e0d08; }

        @keyframes scaleIn {
            0% { transform:scale(0); opacity:0; }
            100% { transform:scale(1); opacity:1; }
        }

        .auth-card h2 { color:#fff; font-weight:800; font-size:1.5rem; margin-bottom:12px; }
        .auth-card p { color:rgba(255,255,255,.5); font-size:.9rem; line-height:1.6; margin-bottom:24px; }

        .btn-auth { display:inline-block; padding:13px 32px;
            background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color:#0e0d08; font-weight:800; font-size:.97rem; border:none;
            border-radius:12px; cursor:pointer; text-decoration:none;
            transition:opacity .2s, transform .15s, box-shadow .2s;
            box-shadow:0 4px 20px rgba(201,162,39,.35); letter-spacing:.3px; }
        .btn-auth:hover { opacity:.91; transform:translateY(-1px); box-shadow:0 8px 28px rgba(201,162,39,.45); }

        .lang-float { position:fixed; top:16px; right:16px; z-index:999; }
        .lang-float button { background:rgba(201,162,39,.15); border:1px solid rgba(201,162,39,.4);
            color:var(--gold-light); font-size:.78rem; font-weight:700; padding:5px 12px;
            border-radius:20px; cursor:pointer; transition:background .2s; font-family:'Inter',sans-serif; }
        .lang-float button:hover { background:rgba(201,162,39,.3); color:#fff; }
    </style>
</head>
<body>
<div class="lang-float">
    <button onclick="toggleLanguage()"><i class="fas fa-globe me-1"></i><span id="langLabel">EN</span></button>
</div>
<div class="auth-page">

    <div class="auth-brand">
        <img src="{% static 'img/logo.png' %}?v=2026" alt="Reserva"
             onerror="this.style.display='none'">
        <div class="brand-name">Reserva</div>
    </div>

    <div class="auth-card">
        <div class="success-icon">
            <i class="fas fa-envelope-circle-check"></i>
        </div>

        <h2 data-i18n="title">Email Στάλθηκε!</h2>
        <p data-i18n="message">
            Σας στείλαμε οδηγίες επαναφοράς κωδικού στο email σας.
            Ελέγξτε τα εισερχόμενά σας (και τον φάκελο spam) και ακολουθήστε τον σύνδεσμο για να ορίσετε νέο κωδικό.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn-auth">
            <i class="fas fa-sign-in-alt me-2"></i><span data-i18n="btn_login">Επιστροφή στη σύνδεση</span>
        </a>
    </div>

</div>
<script>
const t = {
  gr:{ title:'Email Στάλθηκε!',
       message:'Σας στείλαμε οδηγίες επαναφοράς κωδικού στο email σας. Ελέγξτε τα εισερχόμενά σας (και τον φάκελο spam) και ακολουθήστε τον σύνδεσμο για να ορίσετε νέο κωδικό.',
       btn_login:'Επιστροφή στη σύνδεση' },
  en:{ title:'Email Sent!',
       message:'We have sent you password reset instructions to your email. Check your inbox (and spam folder) and follow the link to set a new password.',
       btn_login:'Back to login' }
};
let lang = localStorage.getItem('lang')||'gr';
function applyLang(l){
  const d=t[l];
  document.querySelectorAll('[data-i18n]').forEach(el=>{ if(d[el.dataset.i18n])el.innerHTML=d[el.dataset.i18n]; });
  document.getElementById('langLabel').textContent=l==='gr'?'EN':'ΕΛ';
  document.documentElement.lang=l==='gr'?'el':'en'; lang=l; localStorage.setItem('lang',l);
}
function toggleLanguage(){ applyLang(lang==='gr'?'en':'gr'); }
document.addEventListener('DOMContentLoaded',()=>applyLang(lang));
</script>
</body>
</html>
