{% load static %}
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Επαναφορά Κωδικού — Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        :root { --gold:#c9a227; --gold-light:#f0c04a; }
        html,body { height:100%; margin:0; font-family:'Inter',sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #1e1600 0%, #070600 55%, #000 100%);
            scrollbar-width:none; -ms-overflow-style:none; }
        body::-webkit-scrollbar { display:none; }

        .auth-page { min-height:100vh; display:flex; flex-direction:column;
            align-items:center; justify-content:center; padding:40px 16px; }

        .auth-brand { text-align:center; margin-bottom:28px; }
        .auth-brand img { width:76px; height:76px; object-fit:contain;
            clip-path:inset(18% round 36px); display:block; margin:0 auto 10px; }
        .auth-brand .brand-name { font-size:1.75rem; font-weight:900;
            color:var(--gold-light); letter-spacing:-0.5px; }
        .auth-brand .brand-sub { font-size:0.85rem; color:rgba(255,255,255,.38); margin-top:2px; }

        .auth-card { width:100%; max-width:440px;
            background:rgba(255,255,255,.04); border:1px solid rgba(201,162,39,.22);
            border-radius:20px; padding:38px 34px;
            backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
            box-shadow:0 24px 60px rgba(0,0,0,.55); }
        .auth-card h2 { color:#fff; font-weight:800; font-size:1.5rem; margin-bottom:4px; }
        .auth-card .auth-subtitle { color:rgba(255,255,255,.4); font-size:.87rem; margin-bottom:26px; }

        .auth-label { font-size:.78rem; font-weight:700; color:rgba(255,255,255,.55);
            letter-spacing:.7px; text-transform:uppercase; margin-bottom:5px; display:block; }

        .auth-field { position:relative; margin-bottom:16px; }
        .auth-field .fi { position:absolute; left:13px; top:50%; transform:translateY(-50%);
            color:var(--gold); font-size:.85rem; pointer-events:none; }
        .auth-field input { width:100%; background:rgba(255,255,255,.06);
            border:1px solid rgba(255,255,255,.11); border-radius:10px; color:#fff;
            padding:11px 13px 11px 38px; font-size:.93rem;
            transition:border-color .2s, box-shadow .2s; outline:none; }
        .auth-field input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,.18);
            background:rgba(255,255,255,.09); }
        .auth-field input::placeholder { color:rgba(255,255,255,.22); }

        .btn-auth { width:100%;
            background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color:#0e0d08; font-weight:800; font-size:.97rem; border:none;
            border-radius:12px; padding:13px; cursor:pointer;
            transition:opacity .2s, transform .15s, box-shadow .2s;
            box-shadow:0 4px 20px rgba(201,162,39,.35); letter-spacing:.3px; }
        .btn-auth:hover { opacity:.91; transform:translateY(-1px); box-shadow:0 8px 28px rgba(201,162,39,.45); }
        .btn-auth:active { transform:translateY(0); }

        .auth-back { text-align:center; margin-top:22px; }
        .auth-back a { color:rgba(255,255,255,.28); font-size:.81rem; text-decoration:none; transition:color .2s; }
        .auth-back a:hover { color:var(--gold-light); }

        /* Language toggle */
        .lang-float { position:fixed; top:16px; right:16px; z-index:999; }
        .lang-float button { background:rgba(201,162,39,.15); border:1px solid rgba(201,162,39,.4);
            color:var(--gold-light); font-size:.78rem; font-weight:700; padding:5px 12px;
            border-radius:20px; cursor:pointer; transition:background .2s; font-family:'Inter',sans-serif; }
        .lang-float button:hover { background:rgba(201,162,39,.3); color:#fff; }

        .info-box { background:rgba(58,120,201,.15); border:1px solid rgba(58,120,201,.4);
            border-radius:10px; padding:14px; margin-bottom:20px; display:flex; align-items:center; }
        .info-box i { color:#93c5fd; font-size:1rem; }
        .info-box span { color:#bfdbfe; font-size:.87rem; }
    </style>
</head>
<body>
<div class="lang-float">
    <button onclick="toggleLanguage()"><i class="fas fa-globe me-1"></i><span id="langLabel">EN</span></button>
</div>
<div class="auth-page">

    <div class="auth-brand">
        <img src="{% static 'img/logo.png' %}?v=2026" alt="Reserva"
             onerror="this.style.display='none'">
        <div class="brand-name">Reserva</div>
        <div class="brand-sub">Το ραντεβού σου, online</div>
    </div>

    <div class="auth-card">
        <h2 data-i18n="title">Επαναφορά Κωδικού</h2>
        <p class="auth-subtitle" data-i18n="subtitle">Εισάγετε το email σας και θα σας στείλουμε οδηγίες για να επαναφέρετε τον κωδικό σας.</p>

        <div class="info-box">
            <i class="fas fa-info-circle me-2"></i>
            <span data-i18n="info">Θα λάβετε ένα email με σύνδεσμο επαναφοράς κωδικού.</span>
        </div>

        <form method="post">
            {% csrf_token %}

            <label class="auth-label" data-i18n="lbl_email">Email</label>
            <div class="auth-field">
                <i class="fas fa-envelope fi"></i>
                <input type="email" name="email"
                      placeholder="Εισάγετε το email σας" data-i18n-placeholder="ph_email"
                       required autofocus>
            </div>

            <button type="submit" class="btn-auth">
                <i class="fas fa-paper-plane me-2"></i><span data-i18n="btn_send">Αποστολή</span>
            </button>
        </form>
    </div>

    <div class="auth-back">
        <a href="{% url 'accounts:login' %}"><i class="fas fa-arrow-left me-1"></i><span data-i18n="back_login">Επιστροφή στη σύνδεση</span></a>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const t = {
  gr:{ title:'Επαναφορά Κωδικού',
       subtitle:'Εισάγετε το email σας και θα σας στείλουμε οδηγίες για να επαναφέρετε τον κωδικό σας.',
       info:'Θα λάβετε ένα email με σύνδεσμο επαναφοράς κωδικού.',
       lbl_email:'Email', ph_email:'Εισάγετε το email σας',
       btn_send:'Αποστολή', back_login:'Επιστροφή στη σύνδεση' },
  en:{ title:'Password Reset',
       subtitle:'Enter your email address and we will send you instructions to reset your password.',
       info:'You will receive an email with a password reset link.',
       lbl_email:'Email', ph_email:'Enter your email address',
       btn_send:'Send', back_login:'Back to login' }
};
let lang = localStorage.getItem('lang')||'gr';
function applyLang(l){
  const d=t[l];
  document.querySelectorAll('[data-i18n]').forEach(el=>{ if(d[el.dataset.i18n])el.innerHTML=d[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ const key=el.dataset.i18nPlaceholder; if(d[key])el.placeholder=d[key]; });
  document.getElementById('langLabel').textContent=l==='gr'?'EN':'ΕΛ';
  document.documentElement.lang=l==='gr'?'el':'en'; lang=l; localStorage.setItem('lang',l);
}
function toggleLanguage(){ applyLang(lang==='gr'?'en':'gr'); }
document.addEventListener('DOMContentLoaded',()=>applyLang(lang));
</script>
</body>
</html>
